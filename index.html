<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monarkitë dhe zhvillimi i shteteve</title>
  <style>
    :root {
      --bg: #f3efe8;
      --paper: #fbf8f5;
      --card: #efe4d6;
      --card2: #e7d5b7;
      --dark: #1e1d1c;
      --text: #2b2a29;
      --muted: #5f5753;
      --accent: #9a5d32;
      --accent2: #7d4524;
      --success: #275f38;
      --danger: #8e3d3d;
      --shadow: rgba(22, 18, 14, 0.1);
      --line: rgba(30, 29, 28, 0.3);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #f2efe9 0%, #f8f3ee 100%);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 18px 50px;
    }

    .topbar {
      background: #f8f2eb;
      border: 3px solid var(--dark);
      border-radius: 18px;
      box-shadow: 0 8px 0 rgba(0,0,0,0.08);
      padding: 20px 14px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 2.8vw, 3rem);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--dark);
      font-weight: 900;
    }

    .section {
      margin-top: 28px;
    }

    .subhead {
      font-size: clamp(1.4rem, 2vw, 2.1rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
      color: var(--dark);
    }

    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .card {
      background: var(--paper);
      border: 3px solid var(--dark);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 0 rgba(0,0,0,0.08);
    }

    .card-header {
      background: linear-gradient(90deg, #d9b08a, #cfa37c);
      padding: 12px 16px;
      font-weight: 900;
      text-transform: uppercase;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
      color: var(--dark);
      border-bottom: 3px solid var(--dark);
    }

    .card-body {
      padding: 16px 18px;
      background: #f6f0ea;
      min-height: 140px;
    }

    .card-body ul {
      margin: 0;
      padding-left: 18px;
      font-size: 0.98rem;
      line-height: 1.8;
    }

    .keywords {
      background: #f6f2ee;
      border: 3px solid var(--dark);
      border-radius: 18px;
      padding: 18px 18px 10px;
      box-shadow: 0 8px 0 rgba(0,0,0,0.08);
    }

    .keyword-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
